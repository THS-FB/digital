<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tunstall Trojan Football</title>
  <link rel="stylesheet" href="css/styles.css">
</head>

<body>
  <header class="site-header">
    <img
      src="assets/logos/ths-trojan-head.png"
      alt="Tunstall Trojan"
      class="trojan-head-logo"
    >

    <h1>Tunstall Trojan Football</h1>

    <p class="team-motto">
      One Team. One Town. All Trojans.
    </p>

    <div class="brand-divider">
      <span></span>

      <img
        src="assets/logos/ths-tt-logo.png"
        alt="Tunstall TT"
        class="tt-logo"
      >

      <span></span>
    </div>
  </header>

  <nav>
    <a href="schedule/">Schedule</a>
    <a href="roster/">Roster</a>
    <a href="sponsors/">Sponsors</a>
    <a href="media/">Media</a>
    <a href="program/">Digital Program</a>
  </nav>

  <main class="home-content">
    <section class="welcome-card">
      <div class="welcome-copy">
        <p class="eyebrow">Tunstall Football</p>
        <h2>Welcome to the Digital Hub</h2>
        <p>
          Follow the Trojans throughout the season with schedules, roster information,
          sponsors, media, and the official digital program.
        </p>
      </div>

      <div class="welcome-image">
        <img
          src="assets/images/tunstall-team-entrance-01.jpg"
          alt="Tunstall football team entrance"
        >
      </div>
    </section>
  </main>

  <script src="js/app.js"></script>
</body>
</html>
