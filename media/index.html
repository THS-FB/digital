<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Media | Tunstall Trojan Football</title>

  <meta
    name="description"
    content="Tunstall Trojan Football media, including photos, video, highlights, and stories."
  >

  <link rel="stylesheet" href="../css/styles.css">

  <style>

    .media-page {
      min-height: 60vh;
    }


    .media-intro {
      padding: 48px 20px 80px;
      text-align: center;
    }


    .media-intro h2 {
      margin: 0 0 14px;

      color: #c8102e;

      font-size: clamp(2rem, 6.5vw, 3rem);
      font-weight: 900;
      line-height: 1.05;

      text-transform: uppercase;
    }


    .media-subtitle {
      max-width: 650px;

      margin: 0 auto;

      color: #4a4a4a;

      font-size: 1rem;
      line-height: 1.5;
    }


    @media (min-width: 768px) {

      .media-intro {
        padding-top: 64px;
        padding-bottom: 110px;
      }

    }

  </style>
</head>


<body>

  <header class="site-header">

    <img
      src="../assets/logos/ths-trojan-head.png"
      alt="Tunstall Trojan"
      class="trojan-head-logo"
    >

    <h1>
      Tunstall Trojan Football
    </h1>

    <p class="team-motto">
      One Team. One Town. All Trojan.
    </p>

    <div class="brand-divider">

      <span></span>

      <img
        src="../assets/logos/ths-tt-logo.png"
        alt="Tunstall TT"
        class="tt-logo"
      >

      <span></span>

    </div>

  </header>


  <nav
    class="site-nav"
    aria-label="Primary navigation"
  >

    <div class="mobile-nav-row">

      <button
        type="button"
        class="menu-toggle"
        id="menu-toggle"
        aria-expanded="false"
        aria-controls="site-menu"
      >

        <svg
          class="menu-icon"
          viewBox="0 0 24 24"
          aria-hidden="true"
        >
          <path d="M4 6h16"></path>
          <path d="M4 12h16"></path>
          <path d="M4 18h16"></path>
        </svg>

        <span>
          Menu
        </span>

      </button>


      <span
        class="mobile-current-link"
        aria-label="Media"
      >

        <svg
          class="mobile-current-icon"
          viewBox="0 0 24 24"
          aria-hidden="true"
        >

          <rect
            x="3"
            y="5"
            width="18"
            height="14"
            rx="2"
          ></rect>

          <path d="m9 10 6 3-6 3Z"></path>

        </svg>

      </span>

    </div>


    <div
      class="nav-links"
      id="site-menu"
    >

      <a href="../">
        Home
      </a>

      <a href="../schedule/">
        Schedule
      </a>

      <a href="../roster/">
        Roster
      </a>

      <a href="../sponsors/">
        Partners
      </a>

      <a
        href="./"
        class="active"
      >
        Media
      </a>

      <a href="../program/">
        Digital Program
      </a>

    </div>

  </nav>


  <main class="media-page">

    <section class="media-intro">

      <h2>
        Trojan Media Coming Soon
      </h2>

      <p class="media-subtitle">
        Photos, video, highlights, and stories from Tunstall Football.
      </p>

    </section>

  </main>


  <footer class="site-footer">

    <div class="footer-motto">

      <span></span>

      <p>
        One Team. One Town. All Trojan.
      </p>

      <span></span>

    </div>


    <p class="footer-copyright">
      &copy; 2026 Tunstall High School Football
    </p>

  </footer>


  <script src="../js/app.js"></script>

</body>
</html>
