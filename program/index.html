<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>
    2026 Digital Program | Tunstall Trojan Football
  </title>

  <meta
    name="description"
    content="View the official 2026 Tunstall Trojan Football Digital Program."
  >

  <link rel="stylesheet" href="../css/styles.css">
</head>


<body>

  <header class="site-header">

    <img
      src="../assets/logos/ths-trojan-head.png"
      alt="Tunstall Trojan"
      class="trojan-head-logo"
    >

    <h1>
      Tunstall Trojan Football
    </h1>

    <p class="team-motto">
      One Team. One Town. All Trojan.
    </p>


    <div class="brand-divider">

      <span></span>

      <img
        src="../assets/logos/ths-tt-logo.png"
        alt="Tunstall TT"
        class="tt-logo"
      >

      <span></span>

    </div>

  </header>


  <nav class="site-nav" aria-label="Primary navigation">

    <div class="mobile-nav-row">

      <button
        type="button"
        class="menu-toggle"
        id="menu-toggle"
        aria-expanded="false"
        aria-controls="site-menu"
      >

        <svg
          class="menu-icon"
          viewBox="0 0 24 24"
          aria-hidden="true"
        >
          <path d="M4 6h16"></path>
          <path d="M4 12h16"></path>
          <path d="M4 18h16"></path>
        </svg>

        <span>
          Menu
        </span>

      </button>


      <span
        class="mobile-current-link"
        aria-label="Digital Program"
      >

        <svg
          class="mobile-current-icon"
          viewBox="0 0 24 24"
          aria-hidden="true"
        >
          <path
            d="M5 4h10a3 3 0 0 1 3 3v13H8a3 3 0 0 1-3-3Z"
          ></path>

          <path d="M8 8h7"></path>
          <path d="M8 12h7"></path>
        </svg>

      </span>

    </div>


    <div class="nav-links" id="site-menu">

      <a href="../">
        Home
      </a>

      <a href="../schedule/">
        Schedule
      </a>

      <a href="../roster/">
        Roster
      </a>

      <a href="../sponsors/">
        Sponsors
      </a>

      <a href="../media/">
        Media
      </a>

      <a
        href="./"
        class="active"
      >
        Digital Program
      </a>

    </div>

  </nav>


  <main class="program-page">


    <section class="program-intro">

      <p class="eyebrow">
        Tunstall Trojan Football
      </p>

      <h2>
        2026 Digital Program
      </h2>

      <p class="program-subtitle">
        Flip through the official Tunstall Trojan Football
        program below.
      </p>

    </section>


    <section
      class="program-viewer-card"
      aria-label="2026 Tunstall Football Digital Program"
    >

      <div class="program-embed-shell">

        <iframe
          class="flipsnack-player"
          src="https://player.flipsnack.com/index.html?hash=N0Y1RDY1OUJEQzkraG0wMXc2MG04eQ=="
          width="100%"
          height="480"
          seamless="seamless"
          scrolling="no"
          frameborder="0"
          allowfullscreen
          allow="fullscreen; autoplay; clipboard-read; clipboard-write"
          loading="lazy"
          title="2026 Tunstall Trojan Football Digital Program"
        ></iframe>

      </div>

    </section>

  </main>


  <footer class="site-footer">

    <div class="footer-motto">

      <span></span>

      <p>
        One Team. One Town. All Trojan.
      </p>

      <span></span>

    </div>


    <p class="footer-copyright">
      &copy; 2026 Tunstall High School Football
    </p>

  </footer>


  <script src="../js/app.js"></script>

</body>
</html>
