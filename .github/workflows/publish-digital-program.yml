name: Publish Digital Program

on:
  push:
    branches: [main]
    paths:
      - 'publish-staging/manifest.json'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download staged program files from Google Drive
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, pathlib, subprocess

          root = pathlib.Path('.')
          manifest = json.loads((root / 'publish-staging/manifest.json').read_text())

          def download(spec):
              file_id = spec['drive_file_id']
              output = root / spec['output']
              output.parent.mkdir(parents=True, exist_ok=True)
              url = f'https://drive.usercontent.google.com/download?id={file_id}&export=download&confirm=t'
              subprocess.run(['curl', '-L', '--fail', '--silent', '--show-error', url, '-o', str(output)], check=True)
              expected = int(spec['bytes'])
              actual = output.stat().st_size
              if actual != expected:
                  raise SystemExit(f'Byte-size mismatch for {output}: {actual} != {expected}')
              return output

          program = download(manifest['program'])
          download(manifest['cover'])

          archive = manifest.get('archive_program')
          if archive:
              archive_path = root / archive
              archive_path.parent.mkdir(parents=True, exist_ok=True)
              archive_path.write_bytes(program.read_bytes())
          PY

      - name: Commit published binaries
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "THS Digital Program Publisher"
          git config user.email "actions@users.noreply.github.com"
          git add assets/program/current-program.pdf assets/program/current-cover.jpg assets/program/archive/
          if git diff --cached --quiet; then
            echo "No binary changes to publish."
            exit 0
          fi
          LABEL=$(python3 -c "import json; print(json.load(open('publish-staging/manifest.json')).get('label','Digital Program'))")
          git commit -m "Publish ${LABEL}"
          git push
