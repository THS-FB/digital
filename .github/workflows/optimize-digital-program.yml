name: Optimize Digital Program

on:
  push:
    branches:
      - main
      - flipbook-performance-v1
    paths:
      - assets/program/current-program.pdf
      - scripts/optimize-program.sh
      - .github/workflows/optimize-digital-program.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: optimize-digital-program-${{ github.ref }}
  cancel-in-progress: true

jobs:
  optimize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Install PDF tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ghostscript qpdf poppler-utils

      - name: Optimize PDF and create cover preview
        run: bash scripts/optimize-program.sh

      - name: Show resulting file sizes
        run: |
          ls -lh assets/program/current-program.pdf assets/program/current-cover.jpg

      - name: Commit optimized assets when changed
        run: |
          if git diff --quiet -- assets/program/current-program.pdf assets/program/current-cover.jpg; then
            echo "No optimized asset changes to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/program/current-program.pdf assets/program/current-cover.jpg
          git commit -m "perf: optimize digital program assets [skip ci]"
          git push origin HEAD:${{ github.ref_name }}
